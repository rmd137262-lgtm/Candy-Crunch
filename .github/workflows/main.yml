name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean

      - name: Create JS Bundle
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ || npx expo export --platform android

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Crunch-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          
          
