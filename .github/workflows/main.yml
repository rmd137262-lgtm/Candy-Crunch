name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Expo dependency
        working-directory: frontend
        run: node -p "require('./node_modules/expo/package.json').version"

      - name: Prebuild Android
        working-directory: frontend
        run: CI=1 npx --no-install expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Crunch-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          
