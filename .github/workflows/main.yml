name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build with Gradle
        run: |
          if [ -d "frontend/android" ]; then
            cd frontend/android
          elif [ -d "android" ]; then
            cd android
          else
            cd frontend && npx expo run:android --no-build-cache || true
            cd android || cd frontend/android
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: "**/build/outputs/apk/release/*.apk"
          
